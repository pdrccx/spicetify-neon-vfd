<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>NEON//VFD · prueba sin Spotify</title>
  <link rel="stylesheet" href="../NeonVFD/user.css">
  <style>
    /* Imitación mínima de la barra de Spotify con los colores del color.ini */
    body { margin: 0; background: #0a0a0d; color: #f2f2f0; }
    .Root__now-playing-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background-color: #16161c; }
    .main-nowPlayingBar-center { max-width: 760px; margin: 0 auto; }
    .player-controls { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .player-controls__buttons { display: flex; gap: 16px; color: #9a9aa5; }
    .playback-bar { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 12px; color: #9a9aa5; }
    .playback-bar .track { flex: 1; height: 4px; background: #2d2d3a; border-radius: 2px; }
    .playback-bar .fill { width: 20%; height: 100%; background: #00f0ff; border-radius: 2px; }
    main { padding: 32px; }
  </style>
</head>
<body>
  <main>
    <h1 class="encore-text-headline-large">Prueba del tema NEON//VFD</h1>
    <p>Página falsa: imita la barra de Spotify y un <code>Spicetify.Player</code> de mentira.</p>
  </main>
  <footer class="Root__now-playing-bar">
    <!-- Estructura real de Spotify 1.3.3 (leída en vivo el 2026-10-28):
         la barra de progreso va DENTRO de div[player-controls], no suelta. -->
    <div class="main-nowPlayingBar-left">Portada · Lay All Your Love On Me · ABBA</div>
    <div class="main-nowPlayingBar-center">
      <div data-testid="player-controls" class="player-controls">
        <div data-testid="general-controls" class="player-controls__buttons">⇄ ⏮ ⏯ ⏭ ↻</div>
        <div class="playback-bar">
          <div data-testid="playback-position">0:42</div>
          <div class="track"><div data-testid="playback-progressbar" class="fill"></div></div>
          <div data-testid="playback-duration">3:30</div>
        </div>
      </div>
    </div>
  </footer>
  <script>try { localStorage.setItem('neonvfd.motion', 'on'); } catch {}</script>
  <script src="mock-spicetify.js"></script>
  <script src="../NeonVFD/theme.js"></script>
</body>
</html>
