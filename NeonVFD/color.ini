; NEON//VFD para Spotify (Spicetify).
; Valores tomados del tema "neon" del Cordero Design System (tokens.css).
; Spicetify convierte cada clave en una variable CSS --spice-<clave>.

[Neon]
; Superficies
main               = 0a0a0d
main-elevated      = 16161c
main-secondary     = 111820
sidebar            = 16161c
player             = 16161c
card               = 16161c
highlight          = 1c1c24
highlight-elevated = 2d2d3a
shadow             = 000000

; Texto
text               = f2f2f0
subtext            = 9a9aa5

; Acentos: cian VFD para rellenos, ámbar para detalles
button             = 00f0ff
button-active      = 00f0ff
button-secondary   = 9a9aa5
button-disabled    = 2d2d3a
play-button        = 00f0ff
playback-bar       = 00f0ff
nav-active         = 00f0ff
nav-active-text    = 04141a
tab-active         = 111820
selected-row       = c8c8d0

; Avisos y extras
notification       = 111820
notification-error = ff3b4f
misc               = ff9d3d
